<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
    <style>
        body {
            display: grid;
            place-items: center;
            height: 90vh;
            font: normal 20px Arial;
        }

        header {
            text-decoration: underline;
        }

        section {
            display: grid;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: white;
            width: 400px;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 5px 5px 10px #00000080;
            padding-bottom: 20px;
        }

        div#txt {
            text-align: center;
        }

        img#img {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            border-radius: 50%;
        }

        footer {
            font-style: italic;
        }
    </style>
</head>
<body onload="carregar()">
    <header>
        <h1>Hora do dia</h1>
    </header>
    <section>
        <div id="txt"></div>
        <div>
            <img alt="Foto dinâmica em função do horário" id="img">
        </div>
    </section>
    <footer>
        <p>Exercício feito por Marcelo Henrique Rosa Reis! :)</p>
    </footer>

    <script>
        function carregar() {
            var data = new Date();
            var hora = data.getHours();
            var txt = document.querySelector('#txt');
            var img = document.querySelector('#img');

            // Conversão para formato 12h
            var hora12 = hora % 12;
            if (hora12 === 0) hora12 = 12;
            var ampm = hora < 12 ? 'AM' : 'PM';

            // Definição singular / plural
            var horaTexto = hora12 === 1 ? 'hora' : 'horas';
            var verbo = hora12 === 1 ? 'é' : 'são';

            txt.innerHTML = `<p>Agora ${verbo} ${hora12} ${horaTexto} (${ampm}).</p>`;

            if (hora < 6) {
                txt.innerHTML += '<p>Boa madrugada! :I</p>';
                img.src = 'imagens/madrugada.jpg';
                document.body.style.backgroundColor = 'lightcoral'
            } else if (hora < 12) {
                txt.innerHTML += '<p>Bom dia! :D</p>';
                img.src = 'imagens/manha.jpg';
                document.body.style.backgroundColor = 'lightgoldenrodyellow'
            } else if (hora < 18) {
                txt.innerHTML += '<p>Boa tarde! ;)</p>';
                img.src = 'imagens/tarde.jpg';
                document.body.style.backgroundColor = 'lightblue'
            } else {
                txt.innerHTML += '<p>Boa noite! :O</p>';
                img.src = 'imagens/noite.jpg';
                document.body.style.backgroundColor = 'lightslategray'
            }
        }
    </script>
</body>
</html>
