<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: brown;
            font-family: 'Arial', sans-serif;
        }

        header {
            display: grid;
            place-items: center;
            background-color: bisque;
            padding: 20px 0;
        }

        header h1 {
            text-decoration: underline;
        }

        main {
            background-color: white;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 20px 0 20px;
            overflow: hidden; /* Impede que margin do último elemento escape (fique cortada) */
            box-shadow: inset 0 0 5px black;
        }

        main div {
            margin: 20px 0;
            border: 1px solid black;
            border-radius: 10px;
            padding: 20px;
        }

        main div form {
            display: grid;
            grid-template-columns: auto 1fr;
            justify-items: start;
            align-items: center;
            gap: 10px;
        }

        form input,
        form button {
            padding: 5px;
        }

        main div.resultado {
            margin: 20px 0 0 0;
        }

        footer {
            display: grid;
            place-items: center;
            background-color: bisque;
            padding: 20px 0;
        }

        footer p a {
            text-decoration: none;
        }

        footer p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Exercícios JavaScript</h1>
    </header>
    <main>
        <h2>1. Crie um programa que escreva um input na tela.</h2>
        <div>
            <form action="" method="get" id="ex1-form" autocomplete="off">
                <label for="ex1-id-texto">Texto:</label>
                <input type="text" name="ex1-texto" id="ex1-id-texto">

                <button type="submit" id="ex1-botao">Enviar</button>
            </form>
            
            <div class="resultado" id="resultado1"></div>
        </div>

        <h2>2. Faça um programa que leia o nome de uma pessoa e mostre uma mensagem de boas-vindas.</h2>
        <div>
            <form action="" method="get" id="ex2-form" autocomplete="off">
                <label for="ex2-id-nome">Nome:</label>
                <input type="text" name="ex2-nome" id="ex2-id-nome">

                <button type="submit" id="ex2-botao">Enviar</button>
            </form>
            
            <div class="resultado" id="resultado2"></div>
        </div>

        <h2>3. Crie um programa que leia dois números e mostre a soma entre eles.</h2>
        <div>
            <form action="" method="get" id="ex3-form" autocomplete="off">
                <label for="ex3-id-numero1">Número 1:</label>
                <input type="number" name="ex3-numero1" id="ex3-id-numero1" required step="any">

                <label for="ex3-id-numero2">Número 2:</label>
                <input type="number" name="ex3-numero2" id="ex3-id-numero2" required step="any">

                <button type="submit" id="ex3-botao">Enviar</button>
            </form>
            
            <div class="resultado" id="resultado3"></div>
        </div>
    </main>
    <footer>
        <p>Exercícios feitos por <a href="https://github.com/Marcelohrr" target="_blank">Marcelo Henrique Rosa Reis</a>.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
