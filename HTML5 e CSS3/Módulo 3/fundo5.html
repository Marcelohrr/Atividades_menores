<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundo 5</title>
    <style>
        #container {
            height: 95vh;
            background-color: red;
            padding: 10px;

            background-image: url("imagens/target001.png");
            background-size: 100% 100%;

            position: relative; /* Torna o container uma referência para elementos posicionados absolutamente dentro dele (sem isso, elementos com position: absolute se posicionam em relação ao body) */
        }

        #conteudo {
            height: 200px;
            width: 500px;
            background-color: green;

            background-image: url("imagens/target001.png");
            background-size: 100% 100%;

            position: absolute;

            left: 50%; /* Distância relativa da borda esquerda do container */
            top: 50%;
            
            transform: translate(-50%, -50%); /* Move metade da largura e da altura do conteúdo para esquerda e para cima */
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo"> <!-- Para centralizar verticalmente, são necessários um container e um conteúdo -->
        </article>
    </section>
</body>
</html>
