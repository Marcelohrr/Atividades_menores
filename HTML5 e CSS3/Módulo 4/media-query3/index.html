<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media query</title>
    <style>
        /* Declarações gerais */
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: lightpink;
            text-align: center;
            background-size: cover;
        }

        h1 {
            display: inline-block;
            background-color: white;
            margin: 10px;
            border: 5px dotted yellow;
            padding: 10px;
        }

        /* Declarações para portrait */
        @media screen and (orientation: portrait) {
            body {
                background-color: blue;
                background-image: url("imagens/portrait.jpg");
                background-position: center top;
            }
        }

        /* Declarações para landscape */
        @media screen and (orientation: landscape) {
            body {
                background-color: green;
                background-image: url("imagens/landscape.jpg");
                background-position: center center;
            }
        }
    </style>
</head>
<body>
    <h1>Mude a orientação do seu dispositivo!</h1>
    <p>Especialmente para projetos pequenos, há a opção de não separar as media queries em diferentes CSS e mantê-las em uma declaração de CSS local!</p>
</body>
</html>
