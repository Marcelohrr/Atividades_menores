<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, sans-serif;
        }

        form {
            display: inline-block;
            border: 1px solid black;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <h1>1.</h1>
    <form action="cadastro.php" autocomplete="off">
    <!--
        autocomplete="off" desliga a sugestão automática do navegador;
        action="cadastro.php" define o arquivo de script que processará os dados do formulário quando o botão de submit for clicado
    -->
        <p><label for="id-nome">Nome:</label> <!-- O elemento label associa o texto ao campo de entrada através do id -->
            <input type="text" name="nome" id="id-nome"></p> <!-- Os campos de entrada precisam ser identificados com name e id — name envia dados ao servidor (PHP, por exemplo) e id identifica o elemento para CSS ou JavaScript -->
        <p><label for="id-sobrenome">Sobrenome:</label>
            <input type="text" name="sobrenome" id="id-sobrenome"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
