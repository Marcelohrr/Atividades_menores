<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, sans-serif;
        }

        form {
            display: inline-block;
            border: 1px solid black;
            padding: 0 10px;
        }

        fieldset {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>1.</h1>
    <form action="cadastro.php" method="get" autocomplete="off">
    <!--
        - autocomplete="off" desliga a sugestão automática do navegador;
        - action="cadastro.php" define o arquivo de script que processará os dados do formulário quando o botão de submit for clicado;
        - method define o método HTTP usado para enviar os dados ao servidor — get (padrão, envia dados pela URL, para quando os dados não forem sensíveis; URL compartilhável; limite de dados de 2 KB a 8 KB) ou post (envia no corpo da requisição, para dados sensíveis; limite de dados muito maior)
    -->
        <p> <!-- <p> serve para formulários mais simples ou textuais, mas <div> é o ideal e mais usado para organizar layout e agrupar campos com CSS em formulários estruturados -->
            <label for="id-nome">Nome:</label> <!-- label associa o texto ao campo de entrada através do id -->
            <input type="text" name="nome" id="id-nome"> <!-- Os campos de entrada precisam ser identificados com name e id — name envia dados ao servidor (PHP, por exemplo) e id identifica o elemento para CSS ou JavaScript -->
        </p>
        <p>
            <label for="id-sobrenome">Sobrenome:</label>
            <input type="text" name="sobrenome" id="id-sobrenome">
        </p>
        <p><input type="submit" value="Enviar"></p>
    </form>

    <h1>2.</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="id-usuario">Usuário:</label>
            <input type="text" name="usuario" id="id-usuario" required minlength="5" maxlength="15" size="15" placeholder="Nome de usuário" autocomplete="username">
        </p>
        <p>
            <label for="id-senha">Senha:</label>
            <input type="password" name="senha" id="id-senha" required minlength="8" maxlength="20" size="20" placeholder="De 8 a 20 caracteres" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h1>3.</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="id-nome">Nome:</label>
            <input type="text" name="nome" id="id-nome" required maxlength="30" placeholder="Nome completo" autocomplete="name">
        </p>
        <p>
            <label for="id-mes">Período atual:</label>
            <input type="month" name="mes" id="id-mes" required value="2025-10">
        </p>
        <p>
            <label for="id-nota">Nota:</label>
            <input type="number" name="nota" id="id-nota" required min="0" max="10" value="6" step="0.1">
        </p>
        <p>
            <label for="id-dia">Dia de hoje:</label>
            <input type="date" name="dia" id="id-dia" value="2025-10-22">
        </p>
        <p>
            <label for="id-hora">Horário de agora:</label>
            <input type="time" name="hora" id="id-hora" value="21:03">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h1>4.</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="id-email">E-mail:</label>
                <input type="email" name="email" id="id-email" autocomplete="email">
            </p>
            <p>
                <label for="id-telefone">Telefone:</label>
                <input type="tel" name="telefone" id="id-telefone" autocomplete="tel" placeholder="(99)99999-9999" pattern="^\([0-9]{2}\)[0-9]{4,5}-[0-9]{4}$"> <!-- Sobre validação de formato com pattern (validação frontend, recomendada para usabilidade, mas limitada), estudar mais sobre RegEx (Regular Expressions) -->
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h1>5.</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <p>
                <input type="radio" name="sexo" id="id-masculino" value="M"> <!-- name igual agrupa os radios (botões de seleção única) e value para enviar resultado -->
                <label for="id-masculino">Masculino</label> <!-- Para radios e checkboxes, o padrão é colocar o label depois do input -->
            </p>
            <p>
                <input type="radio" name="sexo" id="id-feminino" value="F">
                <label for="id-feminino">Feminino</label>
            </p>
            <p>
                <input type="radio" name="sexo" id="id-outro" checked value="O"> <!-- checked define o valor padrão selecionado -->
                <label for="id-outro">Outro / Prefiro não informar</label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <p>
                <input type="checkbox" name="futebol" id="id-futebol">
                <label for="id-futebol">Futebol</label>
            </p>
            <p>
                <input type="checkbox" name="volei" id="id-volei" checked>
                <label for="id-volei">Vôlei</label>
            </p>
            <p>
                <input type="checkbox" name="basquete" id="id-basquete">
                <label for="id-basquete">Basquete</label>
            </p>
            <p>
                <input type="checkbox" name="natacao" id="id-natacao">
                <label for="id-natacao">Natação</label>
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Reset">
        </p>
    </form>

    <h1>6.</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="id-cor">Cor:</label>
            <input type="color" name="cor" id="id-cor" value="#ffffff">
        </p>
        <p>
            <label for="id-nivel">Nível:</label>
            <input type="range" name="nivel" id="id-nivel" min="1" max="5" value="2" step="0.5">
        </p>
        <p>
            <label for="id-foto">Foto:</label>
            <input type="file" name="foto" id="id-foto"> <!-- Para upload de arquivos, form precisa de: method="post" e enctype="multipart/form-data" (define que o formulário enviará os dados em partes separadas, permitindo o envio de arquivos junto com texto) -->
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h1>7.</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="id-estado">Estado:</label>
            <select name="estado" id="id-estado">
                <option value="" disabled selected>Selecione um estado</option> <!-- Placeholder padrão recomendado para select -->
                <optgroup label="Centro-Oeste">
                    <option value="DF">Distrito Federal</option> <!-- Em select, o texto interno de option é exibido e value é enviado -->
                    <option value="GO">Goiás</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                </optgroup>
                <optgroup label="Nordeste">
                    <option value="AL">Alagoas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="MA">Maranhão</option>
                    <option value="PB">Paraíba</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="SE">Sergipe</option>
                </optgroup>
                <optgroup label="Norte">
                    <option value="AC">Acre</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="PA">Pará</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="TO">Tocantins</option>
                </optgroup>
                <optgroup label="Sudeste">
                    <option value="ES">Espírito Santo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                </optgroup>
                <optgroup label="Sul">
                    <option value="PR">Paraná</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="SC">Santa Catarina</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="id-profissao">Profissão:</label>
            <input type="text" name="profissao" id="id-profissao" list="lista-profissoes" placeholder="Selecione ou digite uma profissão" style="width: 220px;">
            <datalist id="lista-profissoes">
                <option value="Advogada(o)">a</option> <!-- Em datalist, são exibidos o texto interno de option e o value, mas só o value é enviado (se não houver value, o texto de option é enviado) -->
                <option value="Desenvolvedor(a)">aa</option>
                <option value="Engenheira(o)">aaa</option>
                <option value="Médica(o)">aaaa</option>
                <option value="Professor(a)">aaaaa</option>
            </datalist>
        </p>
        <p>
            <label for="id-mensagem">Mensagem:</label><br>
            <textarea name="mensagem" id="id-mensagem" cols="30" rows="10" placeholder="Sua mensagem!"></textarea> <!-- Usando textarea, method deve ser post para evitar limite de dados na URL -->
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
