<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        div.container {
            display: flex;
            flex-direction: column-reverse; /* Padrão = row; Outros valores: row-reverse, column, column-reverse */
            /*
            main-axis = criado automaticamente, vai do main-start ao main-end de acordo com a direção estabelecida
            cross-axis (eixo transversal) = perpendicular ao main-axis, vai do cross-start ao cross-end
            */
            background-color: lightseagreen;
            margin: 10px;
            border: 2px solid black;
            border-radius: 10px;
            padding: 10px;
        }

        div.item {
            flex: auto; /* Redimensiona itens de acordo com o tamanho do container */
            background-color: lightcoral;
            margin: 5px;
            border: 2px solid black;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
