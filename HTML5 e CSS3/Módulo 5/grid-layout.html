<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container {
            border: 2px solid green;
            margin-bottom: 20px;
        }

        div.item, div.caixa1, div.caixa2, div.caixa3 {
            border: 2px dashed red;
        }

        div.container.um {
            height: 400px;
            display: grid;
            grid-auto-flow: column; /* Padrão = row */
            grid-template-rows: repeat(3, 100px); /* repeat(n, x) repete um padrão de tamanho x n vezes */
            grid-template-columns: 3fr 2fr 1fr; /* fr (fraction) divide o espaço disponível em partes proporcionais */
            /*
            grid-template-rows e grid-template-columns definem a quantidade e o tamanho das linhas e das colunas
            Padrão = none (nenhuma trilha explícita é definida; assim, conforme necessário, itens usam as trilhas implícitas, cujo tamanho vem de grid-auto-rows e grid-auto-columns, de padrão = auto);
            Valores comuns:
            - fr (mais usado, fração do espaço disponível)
            - auto (tamanho automático conforme o conteúdo)
            - px / em / %
            As unidades podem ser misturadas, como: "grid-template-columns: 100px 20% repeat(2, 1fr);" — nesse caso, a 1ª coluna tem 100px, a 2ª tem 20% da largura total do container e a 3ª e 4ª têm 1/2 cada da largura restante do container (por ser calculado em função do espaço restante, fr sempre é calculado depois de reservar o espaço das outras unidades)
            */
            /* Shorthand = grid-template: repeat(3, 100px) / 3fr 2fr 1fr; (grid-template-rows / grid-template-columns) */

            gap: 10px;
            /*
            gap define o espaçamento entre itens (row-gap + column-gap)
            Padrão = 0
            */

            align-content: space-evenly;
            /*
            align-content alinha toda a grade no eixo vertical (block-axis) — só funciona quando há espaço sobrando no container
            Padrão = normal;
            Outros valores:
            - start
            - end
            - center
            - space-between
            - space-evenly
            - space-around
            */
            justify-content: normal;
            /*
            justify-content alinha toda a grade no eixo horizontal (inline-axis) — só funciona quando há espaço sobrando no container
            Padrão = normal (não aplica alinhamento);
            Outros valores:
            - start
            - end
            - center
            - space-between
            - space-evenly
            - space-around
            */
            /* Shorthand = place-content: center space-evenly; (align-content justify-content) */

            align-items: start;
            /*
            align-items alinha cada item no eixo vertical
            Padrão = stretch;
            Outros valores:
            - start
            - end
            - center
            - baseline (alinha o item pela linha de base do conteúdo)
            */
            justify-items: end;
            /*
            justify-items alinha cada item no eixo horizontal
            Padrão = stretch;
            Outros valores:
            - start
            - end
            - center
            */
            /* Shorthand = place-items: start end; (align-items justify-items) */

            grid-auto-rows: 100px;
            grid-auto-columns: 1fr;
            /*
            grid-auto-rows e grid-auto-columns definem o tamanho das linhas e colunas implícitas (criadas automaticamente quando há mais itens do que trilhas explícitas definidas)
            Padrão = auto (tamanho necessário para acomodar o maior item da linha/coluna);
            */
        }

        div.container.dois {
            display: grid;
            grid-template: repeat(3, 64px) / repeat(4, 1fr);
        }

        div.caixa1.dois {
            background-color: lightcoral;
            grid-row: 1 / 2; /* shorthand para (grid-row-start / grid-row-end) */
            grid-column: 1 / -1; /* shorthand para (grid-column-start / grid-column-end) */
        }

        div.caixa2.dois {
            background-color: lightgreen;
            grid-row: 2 / -1;
            grid-column: 1 / span 2; /* span = ocupa mais 2 colunas a partir do início */
        }

        div.caixa3.dois {
            background-color: lightblue;
            grid-area: 2 / 3 / -1 / -1; /* shorthand para (grid-row-start / grid-column-start / grid-row-end / grid-column-end) */
        }

        div.container.tres {
            display: grid;
            height: 500px;
            grid-template: 2fr 1fr 5fr 1fr / 3fr 1fr;
        }

        #topo {
            background-color: red;
            grid-area: 1 / 1 / 2 / -1;
        }

        #menu {
            background-color: green;
            grid-area: 2 / 1 / 3 / -1;
        }

        #principal {
            background-color: blue;
            grid-area: 3 / 1 / 4 / -2;
        }

        #secundario {
            background-color: yellow;
            grid-area: 3 / 2 / 4 / -1;
        }

        #rodape {
            background-color: purple;
            grid-area: 4 / 1 / -1 / -1;
        }
    </style>
</head>
<body>
    <div class="container um">
        <div class="item um">A</div>
        <div class="item um">B</div>
        <div class="item um">C</div>
        <div class="item um">D</div>
        <div class="item um">E</div>
        <div class="item um">F</div>
        <div class="item um">G</div>
    </div>

    <div class="container dois">
        <div class="caixa1 dois">Caixa 1</div>
        <div class="caixa2 dois">Caixa 2</div>
        <div class="caixa3 dois">Caixa 3</div>
    </div>

    <div class="container tres">
        <header id="topo">
            Topo
        </header>
        <nav id="menu">
            Menu
        </nav>
        <main id="principal">
            Principal
        </main>
        <aside id="secundario">
            Secundário
        </aside>
        <footer id="rodape">
            Rodapé
        </footer>
    </div>
</body>
</html>
