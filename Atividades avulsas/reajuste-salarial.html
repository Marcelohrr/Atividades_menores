<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reajuste salarial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
        }

        body {
            display: grid;
            place-items: center;
            height: 90vh;
            background-color: lightblue;
        }

        header > h1 {
            text-decoration: underline;
            margin-top: 20px;
        }

        main {
            background-color: white;
            width: 500px;
            margin: 20px 0;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 5px 5px 10px #00000080;
            padding: 10px 20px 20px 20px;
        }

        form {
            margin-top: 10px;
        }

        form > fieldset {
            margin: 10px 0;
            padding: 10px;
        }

        div#resultado {
            display: grid;
            place-items: center;
        }

        footer > p {
            font-style: italic;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Reajuste salarial</h1>
    </header>
    <main>
        <form action="" method="get" id="formulario">
            <fieldset>
                <legend>Insira o seu salário atual</legend>

                <div>
                    <input type="number" name="salario-atual" id="id-salario-atual" min="1621" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Insira o seu gênero</legend>

                <div>
                    <input type="radio" name="genero" id="id-feminino" value="F">
                    <label for="id-feminino">Feminino</label>
                </div>
                <div>
                    <input type="radio" name="genero" id="id-masculino" value="M">
                    <label for="id-masculino">Masculino</label>
                </div>
                <div>
                    <input type="radio" name="genero" id="id-naobinario" value="N">
                    <label for="id-naobinario">Não-binário</label>
                </div>
                <div>
                    <input type="radio" name="genero" id="id-outro" value="O">
                    <label for="id-outro">Outro ou não quero informar</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Insira há quantos anos você trabalha na empresa</legend>

                <div>
                    <input type="number" name="tempo-trabalho" id="id-tempo-trabalho" min="0" required>
                </div>
            </fieldset>

            <button type="submit">Enviar</button>
        </form>

        <div id="resultado"></div>
    </main>
    <footer>
        <p>Exercício feito por Marcelo Henrique Rosa Reis! :)</p>
    </footer>

    <script>
        const form = document.querySelector('form#formulario');

        const inputSalarioAtual = form.querySelector('input#id-salario-atual');
        const inputTempoTrabalho = form.querySelector('input#id-tempo-trabalho');

        const resultadoDiv = document.querySelector('div#resultado');

        let boxEstilo = false;

        const tabelaReajuste = {
            F: [
                { tabelaTempo: 6,  tabelaPercentual: 0.04 },
                { tabelaTempo: 15, tabelaPercentual: 0.09 },
                { tabelaTempo: 28, tabelaPercentual: 0.06 },
                { tabelaTempo: 47, tabelaPercentual: 0.14 },
                { tabelaTempo: Infinity, tabelaPercentual: 0.22 }
            ],
            M: [
                { tabelaTempo: 11, tabelaPercentual: 0.03 },
                { tabelaTempo: 23, tabelaPercentual: 0.08 },
                { tabelaTempo: 36, tabelaPercentual: 0.12 },
                { tabelaTempo: 58, tabelaPercentual: 0.18 },
                { tabelaTempo: Infinity, tabelaPercentual: 0.25 }
            ],
            N: [
                { tabelaTempo: 9,  tabelaPercentual: 0.05 },
                { tabelaTempo: 19, tabelaPercentual: 0.10 },
                { tabelaTempo: 34, tabelaPercentual: 0.07 },
                { tabelaTempo: 51, tabelaPercentual: 0.16 },
                { tabelaTempo: Infinity, tabelaPercentual: 0.24 }
            ],
            O: [
                { tabelaTempo: 8,  tabelaPercentual: 0.04 },
                { tabelaTempo: 21, tabelaPercentual: 0.11 },
                { tabelaTempo: 39, tabelaPercentual: 0.09 },
                { tabelaTempo: 62, tabelaPercentual: 0.17 },
                { tabelaTempo: Infinity, tabelaPercentual: 0.27 }
            ]
        };

        function calcularReajuste(s, g, t) {
            for (const { tabelaTempo, tabelaPercentual } of tabelaReajuste[g]) {
                if (t < tabelaTempo) {
                    return s + s * tabelaPercentual;
                }
            }
        }

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            if (!inputSalarioAtual.value || !inputTempoTrabalho.value) {
                throw new Error('Campo(s) não preenchido(s)!');
            }

            const inputGenero = form.querySelector('input[name="genero"]:checked'); // Seleciona o input com atributo name igual a gênero marcado (deve ficar dentro do submit, para consultar o DOM no momento do envio)

            const salarioAtual = Number(inputSalarioAtual.value);
            const genero = inputGenero ? inputGenero.value : 'O';
            const tempoTrabalho = Number(inputTempoTrabalho.value);

            const reajuste = calcularReajuste(salarioAtual, genero, tempoTrabalho);

            if (!boxEstilo) {
                resultadoDiv.style.backgroundColor = 'lightcyan';
                resultadoDiv.style.marginTop = '20px';
                resultadoDiv.style.borderRadius = '10px';
                resultadoDiv.style.padding = '10px';
                resultadoDiv.style.textAlign = 'center';
                boxEstilo = true;
            }

            resultadoDiv.textContent = `O salário foi reajustado de ${salarioAtual} para ${reajuste}! 📈`;
        })
    </script>
</body>
</html>
