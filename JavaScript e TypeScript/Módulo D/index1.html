<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições</title>
</head>
<body>
    <h1>Exercícios de condições</h1>
    <h2>1.</h2>
    <p>Limite de velocidade = 27,78 m/s.</p>
    <p>Velocidade do veículo: <input type="number" name="txtvel" id="txtvel"> km/h.</p>
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="resultado"></div>

    <h2>2.</h2>
    <p>Em qual país você nasceu?</p>
    <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Ok" onclick="nacionalidade()">
    <p>Nacionalidade:</p>
    <div id="nacionalidade"></div>

    <h2>3.1</h2>
    <p>Insira uma idade: <input type="number" name="txtidade" id="txtidade"> anos.</p>
    <input type="button" value="Ok" onclick="voto()">
    <div id="situacao"></div>

    <h2>3.2</h2>
    <input type="button" value="Prazer, sou um botão educado!" onclick="cumprimentar()">
    <div id="cumprimento"></div>

    <h2>4.</h2>
    <input type="button" value="Clique para saber o dia da semana!" onclick="verificarDia()">
    <div id="dia"></div>

    <script>
        // Exercício 1: Condição simples
        function verificar() {
            var txtv = window.document.querySelector('input#txtvel');
            var velocidade = Number(txtv.value);

            var resultado = window.document.querySelector('div#resultado');
            resultado.innerHTML = `<p>Velocidade = ${velocidade}km/h.</p>`;

            if (velocidade > 100) {
                resultado.innerHTML += '<p><strong>Multado!</strong></p>';
            }

            resultado.innerHTML += '<p>Verificação concluída!</p>';
        }

        // Exercício 2: Condição composta
        function nacionalidade() {
            var pais = window.document.querySelector('input#txtpais').value;
            var nacionalidade = window.document.querySelector('div#nacionalidade');
            if (pais.toLowerCase() === 'brasil') {
                nacionalidade.innerHTML += '<p>brasileiro!</p>';
            } else {
                nacionalidade.innerHTML += '<p>estrangeiro!</p>';
            }
        }

        // Exercício 3.1: Condições aninhadas
        function voto() {
            var idade = Number(window.document.querySelector('input#txtidade').value);
            var situacao = window.document.querySelector('div#situacao');
            if (idade < 16) {
                situacao.innerHTML = `<p>Voto proibido!</p>`;
            } else if (idade < 18 || idade >= 70) {
                situacao.innerHTML = `<p>Voto facultativo!</p>`;
            } else {
                situacao.innerHTML = `<p>Voto obrigatório!</p>`;
            }
        }

        // Exercício 3.2: Condições aninhadas
        function cumprimentar() {
            var agora = new Date();
            var hora = agora.getHours();
            var cumprimento = window.document.querySelector('div#cumprimento');
            cumprimento.innerHTML = `<p>São ${hora} horas!</p>`;
            if (hora < 6) {
                cumprimento.innerHTML += '<p>Boa madrugada! :I</p>';
            } else if (hora < 12) {
                cumprimento.innerHTML += '<p>Bom dia! :D</p>';
            } else if (hora < 18) {
                cumprimento.innerHTML += '<p>Boa tarde! ;)</p>';
            } else {
                cumprimento.innerHTML += '<p>Boa noite! :O</p>';
            }
        }

        // Exercício 4: Condição múltipla
        function verificarDia() {
            var agora = new Date();
            var diaSemana = agora.getDay();
            var dia = window.document.querySelector('div#dia');
            
            switch (diaSemana) {
                case 0:
                    dia.innerHTML = '<p>Hoje é domingo!</p>';
                    break;
                case 1:
                    dia.innerHTML = '<p>Hoje é segunda!</p>';
                    break;
                case 2:
                    dia.innerHTML = '<p>Hoje é terça!</p>';
                    break;
                case 3:
                    dia.innerHTML = '<p>Hoje é quarta!</p>';
                    break;
                case 4:
                    dia.innerHTML = '<p>Hoje é quinta!</p>';
                    break;
                case 5:
                    dia.innerHTML = '<p>Hoje é sexta!</p>';
                    break;
                case 6:
                    dia.innerHTML = '<p>Hoje é sábado!</p>';
                    break;
                default:
                    dia.innerHTML = '<p>Erro: dia inválido!</p>';
                    break;
            }
        }
    </script>
</body>
</html>
