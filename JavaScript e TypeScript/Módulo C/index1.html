<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        body {
            background-color: black;
            color: white;
            font: 500 20px Arial;
        }

        div {
            margin-bottom: 20px;
        }

        strong {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Parágrafo 1.</p>
    <p>Aprendendo a usar o <strong>Document Object Model</strong> em JavaScript.</p>
    <div id="mensagem"></div>
    <script>
        var corpo = window.document.body

        /*
        Métodos de navegar entre os elementos na árvore DOM:
        •	Por Marca – getElementsByTagName()
        •	Por Id – getElementById()
        •	Por Nome – getElementsByName()
        •	Por Classe – getElementsByClassName()
        •	Por Seletor – querySelector() e querySelectorAll()
        */

        var p1 = window.document.getElementsByTagName('p')[0]
        var p2 = window.document.getElementsByTagName('p')[1]
        var d = window.document.getElementById('mensagem') // equivalente a: var d = window.document.querySelector('div#mensagem')

        corpo.style.background = 'brown'
        p1.style.color = 'yellow'
        d.style.background = 'blue'
        d.innerHTML = 'Divisão preenchida com o script <strong>d.innerHTML</strong>.' // equivalente a: window.document.getElementById('mensagem').innerHTML

        window.document.write(`• window.document.write 1: Está escrito "${p1.innerText}" no innerText do primeiro elemento de tag p. <br>`)
        window.document.write(`<br> • window.document.write 2: innerText pega só o texto, já innerHTML pega toda a marcação. Por exemplo, no segundo parágrafo: <br> "${p2.innerHTML}"`)
    </script>
</body>
</html>
