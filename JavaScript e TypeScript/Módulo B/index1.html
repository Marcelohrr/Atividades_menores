<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamento de dados</title>
</head>
<body>

    <script>
        var nome = window.prompt('Qual é seu nome?')
        window.alert(`Prazer, ${nome}!`)

        var n1 = Number.parseInt(window.prompt('Digite um número inteiro:')) // Conversão String → Número inteiro
        var n2 = Number.parseFloat(window.prompt('Digite outro número real:')) // Conversão String → Número de ponto flutuante
        var n3 = Number(window.prompt('Digite um número qualquer:')) // Conversão String → Número
        var soma = n1 + n2 + n3
        window.alert(`A soma dos valores é ${soma}.`)

        /*
        Conversão de Número (n) para String:
        - String(n)
        - n.toString()
        */

        /*
        Formatação de Strings (s):
        - s.length
        - s.toUpperCase()
        - s.toLowerCase()
        */

        var titulo = window.prompt('Digite um título:')
        document.write(`<h1>${titulo.toUpperCase()}</h1><p>O título digitado tem ${titulo.length} caracteres.</p>`)

        /*
        Formatação de Números (n):
        - n.toFixed(2) → retorna uma String; valor em parêntesis = casas decimais exibidas
        - String(n).replace('.', ',') → replace() funciona somente em strings
        - n.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})
        */
    </script>
</body>
</html>
